<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Mochi Bloom — Mobile Prototype</title>
  <style>
    html, body { margin: 0; padding: 0; background: #fff; }
    body { min-width: 100%; overflow-x: hidden; }
    img { display: block; width: 100vw; height: auto; margin: 0; padding: 0; border: 0; }
    @media (min-width: 600px) {
      body { display: flex; justify-content: center; background: #eee; }
      img { width: 390px; max-width: 390px; }
    }
  </style>
</head>
<body>
  <img id="prototype" alt="Mochi Bloom mobile landing page prototype">
  <script>
    document.getElementById('prototype').src = './mb-site-mobile.png?v=' + Date.now();
  </script>
</body>
</html>
